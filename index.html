<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0a0f" />
<title>Astra</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0a0a0f;
    color: #fff;
  }

  /* ===== صفحه لودینگ ===== */
  #loader {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: radial-gradient(circle at 50% 40%, #13131f 0%, #0a0a0f 70%);
    z-index: 999;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    padding: 20px;
  }

  #loader.hide {
    opacity: 0;
    visibility: hidden;
  }

  /* اسپینر */
  .spinner {
    width: clamp(48px, 14vw, 72px);
    height: clamp(48px, 14vw, 72px);
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.08);
    border-top-color: #7c5cff;
    border-right-color: #22d3ee;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 30px rgba(124, 92, 255, 0.35);
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* متن لودینگ */
  .loading-text {
    font-size: clamp(16px, 5vw, 22px);
    font-weight: 500;
    letter-spacing: 0.5px;
    color: #cfcfff;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .loading-text .dots span {
    display: inline-block;
    animation: blink 1.4s infinite both;
  }
  .loading-text .dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-text .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  /* نوار پیشرفت */
  .progress-bar {
    width: min(280px, 70vw);
    height: 4px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-bar .fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7c5cff, #22d3ee);
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  /* ===== محتوای اصلی ===== */
  #app {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  #app.show {
    opacity: 1;
    transform: translateY(0);
  }

  #app h1 {
    font-size: clamp(28px, 9vw, 48px);
    font-weight: 700;
    background: linear-gradient(135deg, #7c5cff, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
    letter-spacing: 1px;
  }

  #app p {
    font-size: clamp(14px, 4.5vw, 18px);
    line-height: 1.9;
    color: #b8b8c8;
    max-width: 480px;
  }

  /* برای گوشی‌های کوچک خیلی کم‌عرض */
  @media (max-width: 340px) {
    .loading-text { font-size: 15px; }
  }
</style>
</head>
<body>

  <!-- صفحه لودینگ -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">
      Astra is loading
      <span class="dots"><span>.</span><span>.</span><span>.</span></span>
    </div>
    <div class="progress-bar"><div class="fill" id="fill"></div></div>
  </div>

  <!-- محتوای اصلی -->
  <div id="app">
    <h1>Astra</h1>
    <p>فعلاً برنامه‌ای براش ندارم، ولی اینجا آماده‌ست که هر وقت خواستی چیزی اضافه کنی.</p>
  </div>

<script>
  const loader = document.getElementById('loader');
  const app    = document.getElementById('app');
  const fill   = document.getElementById('fill');

  // شبیه‌سازی لود شدن (می‌تونی با رویداد واقعی window.load جایگزین کنی)
  let progress = 0;
  const interval = setInterval(() => {
    progress += Math.random() * 18 + 6;
    if (progress >= 100) {
      progress = 100;
      fill.style.width = '100%';
      clearInterval(interval);

      // یه مکث کوتاه بعد از کامل شدن نوار
      setTimeout(() => {
        loader.classList.add('hide');
        app.classList.add('show');
      }, 400);
    } else {
      fill.style.width = progress + '%';
    }
  }, 250);

  // نکته: اگه می‌خوای دقیقاً بعد از لود کامل صفحه اجرا بشه،
  // به‌جای کد بالا از این استفاده کن:
  /*
  window.addEventListener('load', () => {
    fill.style.width = '100%';
    setTimeout(() => {
      loader.classList.add('hide');
      app.classList.add('show');
    }, 400);
  });
  */
</script>

</body>
</html>
